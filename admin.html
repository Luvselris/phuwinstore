<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard ♡ phuwin_store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-black: #0c0c0e;
      --card-dark: #16161a;
      --card-elevated: #1e1e24;
      --border-dark: #2c2c34;
      --text-main: #f4f4f5;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px 80px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: var(--card-dark);
      border-radius: 24px;
      padding: 20px 18px;
      border: 1px solid var(--border-dark);
      margin-bottom: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      margin-bottom: 16px;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #e4e4e7;
      margin-bottom: 6px;
      display: block;
    }

    .input-box, .textarea-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid var(--border-dark);
      outline: none;
      font-size: 13.5px;
      background: #101014;
      color: #ffffff;
      transition: border-color 0.2s;
    }

    .input-box:focus, .textarea-box:focus {
      border-color: #a1a1aa;
    }

    .textarea-box {
      resize: vertical;
      min-height: 84px;
      line-height: 1.5;
    }

    .file-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      background: var(--card-elevated);
      border: 1px dashed #71717a;
      border-radius: 14px;
      color: #f4f4f5;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid #52525b;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      background: #27272a;
      color: #ffffff;
      margin-top: 6px;
      transition: opacity 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #323238;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #141418;
      color: #e4e4e7;
      border: 1px solid var(--border-dark);
      margin-top: 10px;
    }

    .btn-add {
      background: var(--card-elevated);
      color: #ffffff;
      border: 1px dashed #71717a;
      font-size: 13px;
      padding: 10px;
      border-radius: 14px;
      margin-top: 8px;
      width: 100%;
      cursor: pointer;
      font-weight: 700;
    }

    .hl-edit-box {
      background: var(--card-elevated);
      border: 1px solid var(--border-dark);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .hl-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .hl-tag {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }

    .hl-delete-btn {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .hl-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .hl-img-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border-dark);
    }

    .hl-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hl-img-del {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .review-del-item {
      background: var(--card-elevated);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .status-msg {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      color: #fff;
      border: 1px solid #52525b;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 999999;
      display: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ล็อกอินแอดมิน -->
  <div class="card" id="loginBox">
    <div class="title">เข้าสู่ระบบแอดมิน ♡ phuwin_store</div>
    <div class="field-group">
      <label class="field-label">email</label>
      <input type="email" id="loginEmail" class="input-box" placeholder="email">
    </div>
    <div class="field-group">
      <label class="field-label">password</label>
      <input type="password" id="loginPassword" class="input-box" placeholder="password">
    </div>
    <button type="button" class="btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
  </div>

  <!-- แดชบอร์ด -->
  <div id="dashboardBox" class="hidden">

    <!-- 1. ข้อมูลส่วนตัว & โปรไฟล์ -->
    <div class="card">
      <div class="title">ข้อมูลโปรไฟล์และแบนเนอร์</div>
      <div class="field-group">
        <label class="field-label">ชื่อหัวเว็บ</label>
        <input type="text" id="siteTitle" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">ชื่อร้าน</label>
        <input type="text" id="username" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">คำอธิบาย</label>
        <textarea id="bio" class="textarea-box"></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">แบนเนอร์</label>
        <label class="file-btn">เลือกรูปภาพจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectImage(event, 'bannerImg')"></label>
        <input type="text" id="bannerImg" class="input-box" placeholder="หรือวางลิงก์รูป">
      </div>

      <div class="field-group">
        <label class="field-label">รูปโปรไฟล์</label>
        <label class="file-btn">เลือกรูปจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectImage(event, 'profileImg')"></label>
        <input type="text" id="profileImg" class="input-box" placeholder="หรือวางลิงก์รูป">
      </div>

      <div class="field-group">
        <label class="field-label">กรอบโปรไฟล์</label>
        <label class="file-btn">เลือกรูปกรอบจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectImage(event, 'profileFrame')"></label>
        <input type="text" id="profileFrame" class="input-box" placeholder="หรือวางลิงก์กรอบ">
      </div>
    </div>

    <!-- 2. จัดการไฮไลท์ -->
    <div class="card">
      <div class="title">จัดการไฮไลท์สตอรี่</div>
      <div id="highlightsManager"></div>
      <button type="button" class="btn-add" onclick="addNewHighlight()">+ เพิ่มไฮไลท์ใหม่</button>
    </div>

    <!-- 3. จัดการโพสต์หน้า Home -->
    <div class="card">
      <div class="title">จัดการโพสต์หน้า Home</div>
      <div id="postsManager"></div>
      <button type="button" class="btn-add" onclick="addNewPost()">+ เพิ่มช่องโพสต์</button>
    </div>

    <!-- 4. ลบ/จัดการรีวิวลูกค้า -->
    <div class="card">
      <div class="title">จัดการรีวิวจากลูกค้า</div>
      <div id="customerFeedbackManager"></div>
    </div>

    <!-- 5. Details & Contact -->
    <div class="card">
      <div class="title">รายละเอียดและการติดต่อ</div>
      <div class="field-group">
        <label class="field-label">เนื้อหาหน้า Details (เว้นไว้ก่อนหรือกรอกเพิ่มทีหลังได้)</label>
        <textarea id="detailsContent" class="textarea-box" placeholder="เว้นไว้ก่อน..."></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">ช่องทางติดต่อ (line oa)</label>
        <input type="text" id="contactTitle1" class="input-box" value="line oa" style="margin-bottom:6px;">
        <input type="text" id="contactUrl1" class="input-box" value="https://lin.ee/ZQkbi0Y">
      </div>
    </div>

    <!-- 6. เพลง -->
    <div class="card">
      <div class="title">เพลงประกอบ</div>
      <div class="field-group">
        <label class="field-label">URL เพลง (.mp3)</label>
        <input type="text" id="musicUrl" class="input-box">
      </div>
    </div>

    <!-- 7. บัญชีแอดมิน -->
    <div class="card">
      <div class="title">บัญชีและความปลอดภัยแอดมิน</div>
      <div class="field-group">
        <label class="field-label">อีเมลแอดมิน</label>
        <input type="email" id="adminEmailInput" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">รหัสผ่านใหม่</label>
        <input type="password" id="newAdminPassword" class="input-box" placeholder="ปล่อยว่างหากไม่เปลี่ยน">
      </div>
    </div>

    <button type="button" class="btn" id="saveBtn" onclick="saveAllConfig()">บันทึกขึ้นระบบทันที</button>
    <button type="button" class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
    authDomain: "benefitie.firebaseapp.com",
    projectId: "benefitie",
    storageBucket: "benefitie.firebasestorage.app",
    messagingSenderId: "270365672215",
    appId: "1:270365672215:web:230d1491091e26ce83ed52"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const DB_SITE = "phuwin_store_site";
  const DB_FEEDBACK = "phuwin_store_feedback";
  const DB_HL_SLIDES = "phuwin_store_hl_slides";

  let currentAdminEmail = "phuwindeknaewza@gmail.com";
  let currentAdminPass = "phuwin11";

  let highlightsData = [
    { title: "review", cover: "", images: [] }
  ];

  let postsData = [];

  db.collection(DB_SITE).doc("config").get().then(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.adminEmail) currentAdminEmail = d.adminEmail;
      if (d.adminPass) currentAdminPass = d.adminPass;
    }
  });

  function showStatus(text, isError = false) {
    const el = document.getElementById("statusMsg");
    el.textContent = text;
    el.style.background = isError ? "#991b1b" : "#18181b";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3000);
  }

  function handleLogin() {
    const e = document.getElementById("loginEmail").value.trim().toLowerCase();
    const p = document.getElementById("loginPassword").value.trim();
    if (e === currentAdminEmail.toLowerCase() && p === currentAdminPass) {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("dashboardBox").classList.remove("hidden");
      loadData();
      listenCustomerFeedbacks();
    } else {
      alert("email หรือ password ไม่ถูกต้องค่ะ");
    }
  }

  function compressImage(file, maxDimension = 1080, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadDirectImage(event, targetInputId) {
    const file = event.target.files[0];
    if (!file) return;
    showStatus("กำลังแปลงไฟล์รูปภาพ...");
    try {
      const base64 = await compressImage(file, 900, 0.85);
      document.getElementById(targetInputId).value = base64;
      showStatus("เลือกรูปภาพสำเร็จ");
    } catch (err) {
      showStatus("เกิดข้อผิดพลาดในการโหลดรูป", true);
    }
  }

  async function loadData() {
    showStatus("กำลังดึงข้อมูลล่าสุด...");
    try {
      const doc = await db.collection(DB_SITE).doc("config").get();
      const d = doc.exists ? doc.data() : {};

      document.getElementById("siteTitle").value = d.siteTitle || "phuwin_store";
      document.getElementById("username").value = d.username || "phuwin_store";
      document.getElementById("bio").value = d.bio || "welcome to phuwin_store\nเช็ครีวิวได้ที่ไฮไลท์ + รีวิวจากลูกค้า";
      document.getElementById("bannerImg").value = d.bannerImg || "https://file.garden/asG8Gt-rqWIpi3II/IMG_4980.jpeg";
      document.getElementById("profileImg").value = d.profileImg || "https://file.garden/asG8Gt-rqWIpi3II/IMG_4992.jpeg";
      document.getElementById("profileFrame").value = d.profileFrame || "https://file.garden/asG8Gt-rqWIpi3II/6C375541-121C-4D44-A621-003BE1EC19B5.png";

      if (d.highlights && Array.isArray(d.highlights)) {
        highlightsData = [];
        for (let i = 0; i < d.highlights.length; i++) {
          const hl = { ...d.highlights[i] };
          const slidesSnap = await db.collection(DB_HL_SLIDES).doc(String(i)).collection("images").orderBy("idx", "asc").get();
          if (!slidesSnap.empty) {
            hl.images = slidesSnap.docs.map(s => s.data().url);
          } else if (!hl.images) {
            hl.images = [];
          }
          highlightsData.push(hl);
        }
      }
      renderHighlightManagers();

      postsData = Array.isArray(d.posts) ? d.posts : [];
      renderPostsManager();

      document.getElementById("detailsContent").value = d.details || "";
      document.getElementById("contactTitle1").value = (d.contacts && d.contacts[0]) ? d.contacts[0].title : "line oa";
      document.getElementById("contactUrl1").value = (d.contacts && d.contacts[0]) ? d.contacts[0].url : "https://lin.ee/ZQkbi0Y";

      document.getElementById("musicUrl").value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/BABYMONSTER%20-%20'DESERVE'%20M%20V.mp3";
      document.getElementById("adminEmailInput").value = currentAdminEmail;

      showStatus("โหลดข้อมูลสำเร็จ");
    } catch (err) {
      showStatus("ไม่สามารถดึงข้อมูลได้: " + err.message, true);
    }
  }

  function renderHighlightManagers() {
    const box = document.getElementById("highlightsManager");
    box.innerHTML = "";
    highlightsData.forEach((hl, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "hl-edit-box";
      wrap.innerHTML = `
        <div class="hl-header-bar">
          <span class="hl-tag">ไฮไลท์ที่ ${idx + 1} (${escapeHtml(hl.title || '')})</span>
          <button type="button" class="hl-delete-btn" onclick="deleteEntireHighlight(${idx})">ลบไฮไลท์นี้</button>
        </div>
        <div class="field-group">
          <label class="field-label">ชื่อไฮไลท์</label>
          <input type="text" class="input-box" value="${escapeAttr(hl.title || '')}" oninput="highlightsData[${idx}].title = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">รูปหน้าปกไฮไลท์</label>
          <input type="text" class="input-box" value="${escapeAttr(hl.cover || '')}" placeholder="URL หน้าปก" oninput="highlightsData[${idx}].cover = this.value">
        </div>
        <label class="file-btn">
          อัปโหลดรูปเพิ่มเข้าสตอรี่นี้ (เลือกได้หลายภาพ)
          <input type="file" accept="image/*" multiple style="display:none;" onchange="uploadStoryImages(event, ${idx})">
        </label>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">มี ${hl.images ? hl.images.length : 0} ภาพในสตอรี่</div>
        <div class="hl-gallery" id="hl-gal-${idx}"></div>
      `;
      box.appendChild(wrap);

      const gal = wrap.querySelector(`#hl-gal-${idx}`);
      if (hl.images) {
        hl.images.forEach((imgUrl, imgIdx) => {
          const item = document.createElement("div");
          item.className = "hl-img-wrap";
          item.innerHTML = `
            <img src="${imgUrl}" alt="Slide">
            <button type="button" class="hl-img-del" onclick="removeStoryImage(${idx}, ${imgIdx})">×</button>
          `;
          gal.appendChild(item);
        });
      }
    });
  }

  function deleteEntireHighlight(index) {
    if (confirm(`ต้องการลบไฮไลท์ "${highlightsData[index].title || 'ไฮไลท์'}" นี้ใช่ไหมคะ?`)) {
      highlightsData.splice(index, 1);
      renderHighlightManagers();
    }
  }

  function addNewHighlight() {
    highlightsData.push({
      title: `Highlight ${highlightsData.length + 1}`,
      cover: "",
      images: []
    });
    renderHighlightManagers();
  }

  async function uploadStoryImages(event, hlIndex) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    if (!highlightsData[hlIndex].images) highlightsData[hlIndex].images = [];

    showStatus("กำลังอัปโหลดและปรับขนาดภาพ...");
    for (const file of files) {
      try {
        const base64 = await compressImage(file, 1080, 0.85);
        highlightsData[hlIndex].images.push(base64);
      } catch (err) {
        console.error("บีบอัดรูปไม่ผ่าน", err);
      }
    }
    renderHighlightManagers();
    showStatus("เพิ่มภาพสตอรี่สำเร็จ (กดปุ่มบันทึกเพื่ออัปเดต)");
  }

  function removeStoryImage(hlIndex, imgIndex) {
    highlightsData[hlIndex].images.splice(imgIndex, 1);
    renderHighlightManagers();
  }

  function addNewPost() {
    postsData.push({ image: "", caption: "" });
    renderPostsManager();
  }

  function deletePost(postIdx) {
    postsData.splice(postIdx, 1);
    renderPostsManager();
  }

  function renderPostsManager() {
    const box = document.getElementById("postsManager");
    box.innerHTML = "";
    if (!postsData.length) {
      box.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:12.5px; padding:10px;">ยังไม่มีโพสต์ กด "+ เพิ่มช่องโพสต์" เพื่อเพิ่มได้เลยค่ะ</div>`;
      return;
    }
    postsData.forEach((p, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "hl-edit-box";
      wrap.innerHTML = `
        <div class="hl-header-bar">
          <span class="hl-tag">โพสต์ที่ ${idx + 1}</span>
          <button type="button" class="hl-delete-btn" onclick="deletePost(${idx})">ลบโพสต์นี้</button>
        </div>
        <label class="file-btn">เลือกรูปโพสต์จากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirectPost(event, ${idx})"></label>
        <input type="text" class="input-box" id="post-img-${idx}" value="${escapeAttr(p.image || '')}" placeholder="หรือวางลิงก์รูป" oninput="postsData[${idx}].image = this.value" style="margin-bottom:6px;">
        <input type="text" class="input-box" value="${escapeAttr(p.caption || '')}" placeholder="แคปชันโพสต์" oninput="postsData[${idx}].caption = this.value">
      `;
      box.appendChild(wrap);
    });
  }

  async function uploadDirectPost(event, postIdx) {
    const file = event.target.files[0];
    if (!file) return;
    showStatus("กำลังแปลงไฟล์รูปโพสต์...");
    try {
      const base64 = await compressImage(file, 900, 0.85);
      postsData[postIdx].image = base64;
      document.getElementById(`post-img-${postIdx}`).value = base64;
      showStatus("ใส่รูปโพสต์เรียบร้อย (อย่าลืมกดบันทึก)");
    } catch (err) {
      showStatus("แปลงรูปไม่สำเร็จ", true);
    }
  }

  function listenCustomerFeedbacks() {
    db.collection(DB_FEEDBACK).orderBy("createdAt", "desc").onSnapshot(snap => {
      const box = document.getElementById("customerFeedbackManager");
      box.innerHTML = "";
      if (snap.empty) {
        box.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:13px; padding:10px;">ยังไม่มีรีวิวส่งเข้ามา</div>`;
        return;
      }
      snap.forEach(doc => {
        const d = doc.data();
        const item = document.createElement("div");
        item.className = "review-del-item";
        item.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:13px; color:#fff;">${escapeHtml(d.name)} (${'★'.repeat(d.stars || 5)})</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">${escapeHtml(d.msg)}</div>
          </div>
          <button type="button" class="hl-delete-btn" onclick="deleteCustomerFeedback('${doc.id}')">ลบ</button>
        `;
        box.appendChild(item);
      });
    });
  }

  async function deleteCustomerFeedback(docId) {
    if (confirm("ต้องการลบรีวิวนี้ใช่ไหมคะ?")) {
      await db.collection(DB_FEEDBACK).doc(docId).delete();
      showStatus("ลบรีวิวสำเร็จ");
    }
  }

  async function saveAllConfig() {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "กำลังบันทึกข้อมูล...";
    showStatus("กำลังอัปเดตข้อมูลขึ้นระบบ...");

    const emailVal = document.getElementById("adminEmailInput").value.trim();
    if (emailVal) currentAdminEmail = emailVal;

    const cleanHighlights = highlightsData.map(h => ({
      title: h.title || "",
      cover: h.cover || (h.images && h.images[0]) || ""
    }));

    const payload = {
      siteTitle: document.getElementById("siteTitle").value.trim(),
      username: document.getElementById("username").value.trim(),
      bio: document.getElementById("bio").value,
      bannerImg: document.getElementById("bannerImg").value.trim(),
      profileImg: document.getElementById("profileImg").value.trim(),
      profileFrame: document.getElementById("profileFrame").value.trim(),

      highlights: cleanHighlights,
      posts: postsData,

      details: document.getElementById("detailsContent").value,
      contacts: [
        {
          title: document.getElementById("contactTitle1").value.trim() || "line oa",
          url: document.getElementById("contactUrl1").value.trim() || "https://lin.ee/ZQkbi0Y"
        }
      ],

      musicUrl: document.getElementById("musicUrl").value.trim(),
      adminEmail: currentAdminEmail,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    const newPass = document.getElementById("newAdminPassword").value.trim();
    if (newPass) {
      payload.adminPass = newPass;
      currentAdminPass = newPass;
    }

    try {
      await db.collection(DB_SITE).doc("config").set(payload, { merge: true });

      for (let i = 0; i < highlightsData.length; i++) {
        const slidesRef = db.collection(DB_HL_SLIDES).doc(String(i)).collection("images");
        const existingSnap = await slidesRef.get();
        const batch = db.batch();
        existingSnap.forEach(d => batch.delete(d.ref));
        await batch.commit();

        const imgs = highlightsData[i].images || [];
        for (let sIdx = 0; sIdx < imgs.length; sIdx++) {
          await slidesRef.doc(String(sIdx).padStart(4, '0')).set({
            idx: sIdx,
            url: imgs[sIdx]
          });
        }
      }

      showStatus("บันทึกข้อมูลทั้งหมดสำเร็จแล้ว");
      alert("บันทึกข้อมูลสำเร็จเรียบร้อยแล้วค่ะ ♡");
      document.getElementById("newAdminPassword").value = "";
    } catch (err) {
      showStatus("บันทึกไม่สำเร็จ: " + err.message, true);
      alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "บันทึกขึ้นระบบทันที";
    }
  }

  function logout() {
    document.getElementById("dashboardBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
</script>
</body>
</html>
